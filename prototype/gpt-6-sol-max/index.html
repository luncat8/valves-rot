<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GPT 6 Sol Max — Rotary Valve Matrix</title>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
	<a href="../../index.html">All prototypes</a>
	<h1>GPT 6 Sol Max / Rotary Valve Matrix</h1>
	<p>10 × 10 fixed housings · rotating solid and hollow valves · granular flow</p>
	<div class="controls">
		<label><input id="air" type="checkbox"> Black air</label>
		<button id="pause" type="button">Pause</button>
		<button id="reset" type="button">New field</button>
		<button id="pour" type="button">Pour particles</button>
		<label>Rotation speed <input id="speed" type="range" min="0" max="3" step="0.1" value="1"><output id="speed-value">1</output></label>
	</div>
	<canvas id="c" tabindex="0" aria-label="Rotating valve matrix"></canvas>
	<p id="stats" aria-live="off"></p>
	<script src="simulation.js"></script>
	<script src="app.js"></script>
</body>
</html>
