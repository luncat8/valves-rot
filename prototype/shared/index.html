<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Combined — Rotary Valve Field</title>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
	<a href="../../index.html">All prototypes</a>
	<h1>Combined / Rotary Valve Field</h1>
	<p>One geometry layer drives drawing and collision, and one fixed-step conservative solver drives the grains. Click a valve or focus the field and use arrow keys plus Enter/Space to turn a rotor.</p>
	<div class="controls">
		<label>Seed <input id="seed" type="number" min="0" max="999999" value="7" step="1"></label>
		<button id="shuffle" type="button">Shuffle seed</button>
		<button id="reset" type="button">Reset</button>
		<button id="pause" type="button">Pause</button>
		<button id="step" type="button">Step</button>
		<button id="pour" type="button">Pour</button>
		<button id="drain" type="button">Drain</button>
		<label>Turn speed <input id="speed" type="range" min="0" max="3" step="0.1" value="1"><output id="speed-value">1</output></label>
		<label><input id="air" type="checkbox"> Black air</label>
		<label><input id="model" type="checkbox"> Air model</label>
	</div>
	<canvas id="c" tabindex="0" aria-label="10 by 10 rotary valve field. Click a valve, or use arrow keys and Enter or Space to rotate a selected valve."></canvas>
	<p id="stats" aria-live="off"></p>
	<script src="geometry.js"></script>
	<script src="render.js"></script>
	<script src="simulation.js"></script>
	<script src="app.js"></script>
</body>
</html>
